enum AcademicResourceCategory {
  LIBRO
  APUNTE
  EXAMEN
  OTRO
}

type Query {
  academicResources(
    subjectId: Int!
    searchTerm: String
    category: AcademicResourceCategory
  ): [AcademicResource!]!
}

type Mutation {
  uploadAcademicResource(
    subjectId: Int!
    title: String!
    description: String
    category: AcademicResourceCategory = OTRO
    version: Int = 1
    fileUrl: String
    externalUrl: String
  ): AcademicResource!

  deleteResource(resourceId: UUID!): AcademicResource!
}
