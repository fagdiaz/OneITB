<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/only-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>OneITB | Red académica institucional</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const hasSession = Boolean(localStorage.getItem('token') && localStorage.getItem('user'));
          const storedTheme = localStorage.getItem('oneitb-theme');
          const theme = hasSession && (storedTheme === 'dark' || storedTheme === 'light')
            ? storedTheme
            : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
