name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend and tests
        run: |
          dotnet restore "API Graphql/OneITB/GraphQL.csproj"
          dotnet restore "API Graphql/Tests/Services.Tests/Services.Tests.csproj"

      - name: Run service tests (core baseline)
        run: dotnet test "API Graphql/Tests/Services.Tests/Services.Tests.csproj" -c Release --no-restore --filter "Category!=GOB12SqlConcurrency&Category!=GOB15BcryptBenchmark&Category!=VendorAdvisoryGHSA"

      - name: Run vendor advisory canary (upstream HotChocolate GHSA - isolated)
        continue-on-error: true
        run: dotnet test "API Graphql/Tests/Services.Tests/Services.Tests.csproj" -c Release --no-restore --filter "Category=VendorAdvisoryGHSA"

      - name: Build backend
        run: dotnet build "API Graphql/OneITB/GraphQL.csproj" -c Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.6

      - name: Check pending EF model changes
        run: dotnet ef migrations has-pending-model-changes --configuration Release --project "API Graphql/Data/Data.csproj" --startup-project "API Graphql/OneITB/GraphQL.csproj"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd/OneItb-FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/OneItb-FE/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run oxlint static analysis (pinned)
        run: npx --yes oxlint@1.94.0 src

      - name: Run frontend component tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
