# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - OneItbApi

on:
  workflow_run:
    workflows: ["Quality Gates"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Commit SHA to deploy to Production (must have a passing Quality Gates run)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  verify_quality_gate:
    name: Verify Quality Gates for Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.verify_policy.outputs.target_sha }}
    steps:
      - name: Checkout Repository for Gating Policy from Trusted Main
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Shared Quality Gates Policy Engine
        id: verify_policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_TARGET_SHA: ${{ github.event.inputs.target_sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DEPLOY_ENV: 'Production'
        run: node scripts/verify-ci-gating.mjs

  build:
    name: Build Backend Application
    needs: [verify_quality_gate]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_quality_gate.outputs.target_sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore "API Graphql/OneITB/GraphQL.csproj"

      - name: Build backend
        run: dotnet build "API Graphql/OneITB/GraphQL.csproj" --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish "API Graphql/OneITB/GraphQL.csproj" -c Release --no-build -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    name: Deploy to Azure Web App (Production)
    runs-on: windows-latest
    needs: [verify_quality_gate, build]
    if: |
      (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      needs.verify_quality_gate.outputs.target_sha != ''
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'OneItbApi'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7D02688D40F4485B94323F0FA7BDD3B9 }}
          package: .
